plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sensi.analytics'
    compileSdk 34

    defaultConfig {
        applicationId "com.sensi.analytics"
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName "2.0"
    }

    // FIX: dùng 1 file keystore CỐ ĐỊNH được commit sẵn trong repo (app/debug.keystore)
    // thay vì để Gradle tự tạo debug keystore ngẫu nhiên trên mỗi máy CI. Nếu không có
    // bước này, mỗi lần GitHub Actions chạy sẽ sinh ra 1 khoá ký khác nhau -> APK build
    // sau sẽ bị Android từ chối cài vì "xung đột chữ ký" với bản build trước (dù cùng
    // package name). Khoá này CHỈ dùng để test cài đặt, không dùng để phát hành Play Store.
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Dùng CHUNG khoá debug cố định ở trên để bản release và bản debug luôn
            // tương thích chữ ký với nhau - cài đè lên nhau được, không bị lỗi xung đột.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Cần bật AIDL để build UserService dùng cho Shizuku
    buildFeatures {
        aidl true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Thư viện Shizuku API - cho phép chạy lệnh shell qua quyền adb/root do Shizuku cấp
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
